name: Rolling release

# Каждый пуш в main собирает мод и обновляет ОДИН вечный релиз на теге
# `release` (без хешей в имени) — ссылка всегда одна и та же:
# https://github.com/<owner>/<repo>/releases/tag/release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Основной jar без sources (loom кладёт оба в build/libs).
          mapfile -t jars < <(ls build/libs/*.jar | grep -v '\-sources\.jar$' || true)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No mod jar found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          # Сносим прошлый вечный релиз и двигаем тег release на этот коммит.
          gh release delete release --yes --cleanup-tag || true
          git push origin :refs/tags/release || true
          git tag -f release
          git push origin release
          gh release create release "${jars[@]}" \
            --title "release" \
            --notes "Latest auto build from ${{ github.sha }} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
